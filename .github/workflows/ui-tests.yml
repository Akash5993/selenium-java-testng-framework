# GitHub Actions: runs the UI test suite in GitHub's cloud on every push and pull request to main.
# Same command as the Jenkinsfile - the framework doesn't care which CI runs it.
name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest  # GitHub's Linux machine; Google Chrome is preinstalled
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven      # reuse downloaded dependencies between runs

      # Headless: the CI machine has no screen. A failing test fails this step, so the run shows red.
      - name: Run UI tests (headless Chrome)
        run: mvn -B clean test -Dheadless=true

      # always(): keep the reports even when tests fail - that's exactly when you need them
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          if-no-files-found: ignore
