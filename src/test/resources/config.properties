# Framework configuration, read once by com.ui.config.ConfigReader.
# Format: key=value, one per line. Lines starting with # are comments.
# Key style: dot.separated.lowercase (same as the API framework).
# Any key can be overridden from the command line, e.g. mvn test -Dheadless=true -Dbrowser=firefox

browser=chrome
base.url=https://www.saucedemo.com

# Whole number of seconds; ConfigReader turns it into a Duration
timeout.seconds=10

# true = run browsers without a visible window (CI servers such as Jenkins have no screen)
headless=false
